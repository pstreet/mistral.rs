name: CI / rocm

on:
  workflow_dispatch:
  pull_request:

jobs:
  check-rocm:
    name: CI / rocm (check + paged-attn tests)

    # For security, only run automatically for:
    # - PRs from the same repo (not forks)
    # - manual workflow dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.name }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    # Runner requirements (provisioned separately): Linux x86_64 with a
    # working ROCm toolkit (hipcc on PATH, ROCM_PATH set), a GPU for the
    # device tests, and Rust stable. There is no hosted ROCm runner; until
    # one is registered this job stays queued, same as CI / cuda without
    # its self-hosted runner.
    runs-on: [self-hosted, Linux, X64, gpu, rocm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl build-essential clang libclang-dev libssl-dev protobuf-compiler pkg-config

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: ROCm sanity
        run: |
          hipcc --version || { echo "::error::hipcc not found on PATH"; exit 1; }
          # rust-lld needs ROCm libs at link time; LD_LIBRARY_PATH is not
          # enough, so derive LIBRARY_PATH from the hipcc location instead
          # of assuming /opt/rocm.
          ROCM_DIR="$(dirname "$(dirname "$(which hipcc)")")"
          echo "LIBRARY_PATH=$ROCM_DIR/lib:${LIBRARY_PATH:-}" >> $GITHUB_ENV
          rocminfo 2>/dev/null | head -n 5 || true

      # Build-only slice: catches the "kernel silently changed on rebase"
      # class (e.g. upstream candle bf16 fast_sum gated __CUDA_ARCH__ >= 800
      # going live in ROCm JIT builds) without needing a full workspace build.
      - name: Check (rocm)
        run: cargo check -p mistralrs --features rocm

      - name: Test paged-attn (rocm)
        run: cargo test -p mistralrs-paged-attn --features rocm
