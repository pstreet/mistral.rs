# mistralrs.toml - mistral.rs config for Strix Halo (gfx1151)
#
# Loaded by: mistralrs from-config -f <this file>
# Model paths are relative to $LOCALAI_ROOT.
# Global defaults: hip:0 device, Q8_0 KV cache, MTP on (n=2), auto eviction.
# `-cuda` twin lanes override to cuda:0 (3090) with device-specific pins.

command = "serve"
# No default_model_id set: `model="default"` (or an omitted model) resolves
# to the first configured model of each category (chat -> qwen3.6-35b-a3b).

[server]
host = "127.0.0.1"
port = 1235
no_ui = true

[global]
# Default device: iGPU (Hip). `-cuda` twin lanes override to cuda:0.
device = "hip:0"

[paged_attn]
cache_type = "Q8_0"

[router]
auto_evict = true
evict_headroom_mb = 2048
load_wait_timeout_secs = 900
evict_busy_wait_secs = 300
idle_ttl_secs = 1800

[runtime]
mtp = true
mtp_n_predict = 2
mtp_draft_sampling = "auto"
max_prefill_chunk_tokens = 4096

[[models]]
model_id = "models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
alias = "qwen3.6-35b-a3b"
lazy = true

[models.format]
quantized_file = "Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"

# 3090 premium lane: same weights, experts cold in CPU RAM.
# V=Q4_0 stays banned on this model (all-NaN trigger on multi-chunk
# tools prompts, 2026-10-14). Draft lm_head ISQ off (memory envelope).
[[models]]
model_id = "models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
alias = "qwen3.6-35b-a3b-cuda"
lazy = true
device = "cuda:0"
expert_device = "cpu"

[models.format]
quantized_file = "Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"

# ============================================================
# Qwen3.8 27B dense (lazy, demand-loaded)
# ============================================================
# Dense 27B. Context: 262K. MTP n=3 (model card recommendation; re-swept
# 2026-10-27: n=2 is +2.3% prose decode but -8.7% on high-acceptance
# content, so n=3 stays).
# KV: K=Q8_0 V=Q4_0 (user intent; model card recommends Q4_0/Q4_0).

[[models]]
model_id = "models/orcarouter/Qwen3.8-27B-Uncensored-GGUF"
alias = "qwen3.8-27b"
lazy = true
mtp_n_predict = 3

[models.format]
quantized_file = "Qwen3.8-27B-Uncensored-Q6_K.gguf"
mmproj = "mmproj-Qwen3.8-27B-Uncensored-f16.gguf"

# ============================================================
# Qwen3.8 Flash-Next MoE (lazy, demand-loaded)
# ============================================================
# New arch (qwen4exp), port pending. 512 experts, 10+1 active.
# Context: 262K. MTP self-speculation. n=2 (sweep pending).

[[models]]
model_id = "models/orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF"
alias = "qwen3.8-flash-next"
lazy = true

[models.format]
quantized_file = "Qwen3.8-Flash-Next-Uncensored-IQ4_XS-MTP-00001-of-00003.gguf"
mmproj = "mmproj-Qwen3.8-Flash-Next-Uncensored-F16.gguf"

# ------------------------------------------------------------
# Muse Glimmer 30B (vision). Dense in this artifact (no _exps tensors
# despite the MoE lineage); Q6_K_XL 26GB does not fit the 3090, so no
# cuda lane. The DFlash drafter (dflash-kquant.gguf) stays hip-only.
# Context: ~256K. No MTP.
# ------------------------------------------------------------
[[models]]
model_id = "models/unsloth/Muse-Glimmer-30B-GGUF"
alias = "Muse-glimmer-30b"
lazy = true
mtp = false

[models.format]
quantized_file = "Muse-Glimmer-30B-UD-Q6_K_XL.gguf"
mmproj = "mmproj-Muse-Glimmer-30B-Q8_0.gguf"

# ------------------------------------------------------------
# Large coder / general
# ------------------------------------------------------------
[[models]]
model_id = "models/unsloth/gemma-4-26B-A4B-it-GGUF"
alias = "gemma-4-26b"
lazy = true
mtp = false

[models.format]
quantized_file = "gemma-4-26B-A4B-it-UD-Q6_K_XL.gguf"
mmproj = "mmproj-F16.gguf"
# No cuda lane: the expert split is now wired for gemma4 (config + arch
# port landed) but the UD-Q6_K_XL quant crushes experts to ~2 bits, leaving
# an ~18GB dense+PLE share that fills the 3090 once loaded (0 MB left for
# KV). Revisit with a Q4 artifact (ISQ is mutually exclusive with the split).

[[models]]
model_id = "models/mradermacher/Llama-3.2-30B-A3B-II-Dark-Champion-INSTRUCT-Heretic-Abliterated-Uncensored-GGUF"
alias = "llama-3.2-30b"
lazy = true
mtp = false

[models.format]
quantized_file = "Llama3.2-30B-A3B-II-Dark-Champion-INSTRUCT-Heretic-Abliterated-Uncensored.Q6_K.gguf"

# ------------------------------------------------------------
# Small / fast
# ------------------------------------------------------------
[[models]]
model_id = "models/unsloth/Qwen3-16B-A3B-GGUF"
alias = "qwen3-16b"
lazy = true
mtp = false

[models.format]
quantized_file = "Qwen3-16B-A3B-Q4_K_M.gguf"

# 3090 lane: 9.1GB fits whole on the card, experts on-GPU (no offload
# latency). No MTP head (verified: no nextn.* tensors).
[[models]]
model_id = "models/unsloth/Qwen3-16B-A3B-GGUF"
alias = "qwen3-16b-cuda"
lazy = true
device = "cuda:0"
mtp = false

[models.format]
quantized_file = "Qwen3-16B-A3B-Q4_K_M.gguf"

[[models]]
model_id = "models/unsloth/Qwen3.5-4B-MTP-GGUF"
alias = "qwen3.5-4b"
lazy = true
# MTP head live. n=6 (model card recommendation).
mtp_n_predict = 6

[models.format]
quantized_file = "Qwen3.5-4B-Q8_0.gguf"

# 3090 lane: proven 151 tok/s with MTP. n=2 pinned (sweep pending);
# the hip twin keeps the card-recommended n=6.
[[models]]
model_id = "models/unsloth/Qwen3.5-4B-MTP-GGUF"
alias = "qwen3.5-4b-cuda"
lazy = true
device = "cuda:0"
mtp_n_predict = 2

[models.format]
quantized_file = "Qwen3.5-4B-Q8_0.gguf"

# ------------------------------------------------------------
# Embeddings (open-webui RAG via /v1/embeddings)
# GGUF Q8_0 since 2026-10-21. pooling layout from model_id dir.
# ------------------------------------------------------------
[[models]]
model_id = "models/Qwen/Qwen3-Embedding-0.6B"
alias = "qwen3-embedding-0.6b"
kind = "embedding"
lazy = true
mtp = false

[models.format]
quantized_file = "Qwen3-Embedding-0.6B-Q8_0.gguf"

# ------------------------------------------------------------
# Reranker (open-webui Reranking Model slot via /v1/rerank)
# Qwen3-Reranker-0.6B, GGUF Q8_0. Jina/Cohere-compatible endpoint.
# ------------------------------------------------------------
[[models]]
model_id = "models/Qwen/Qwen3-Reranker-0.6B"
alias = "qwen3-reranker-0.6b"
kind = "reranker"
lazy = true
mtp = false

[models.format]
quantized_file = "qwen3-reranker-0.6b-q8_0.gguf"