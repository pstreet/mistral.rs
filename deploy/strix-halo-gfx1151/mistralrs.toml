# mistralrs.toml - mistral.rs config for Strix Halo (gfx1151)
#
# Loaded by: mistralrs from-config -f <this file>
# Model paths are relative to $LOCALAI_ROOT.
# Global defaults: hip:0 device, Q8_0 KV cache, MTP on (n=2), auto eviction.

command = "serve"
# No default model: clients must specify model by alias.

[server]
host = "127.0.0.1"
port = 1235
no_ui = true

[global]
# Default device: iGPU (Hip). MoE 35B and -cuda lanes override to cuda:0.
device = "hip:0"

[paged_attn]
cache_type = "Q8_0"

[router]
auto_evict = true
evict_headroom_mb = 2048
load_wait_timeout_secs = 900
evict_busy_wait_secs = 300
idle_ttl_secs = 1800

[runtime]
mtp = true
mtp_n_predict = 2
mtp_draft_sampling = "auto"
# Draft lm_head ISQ disabled 2026-10-23 (memory envelope on 3090).
# Re-enable for +2.6% decode on the 35B: mtp_draft_lm_head_isq = "Q4K"
max_prefill_chunk_tokens = 2048
# prefix_cache_n: code default 16.

# ============================================================
# Qwen3.6 35B MoE (lazy; primary model)
# ============================================================
# MoE: 256 experts, 8 active. Runs on cuda:0 with cold experts in CPU RAM.
# Context: 262K native. MTP n=2 (unsloth recommends 2 for Qwen3.6).
# V=Q8_0: V=Q4_0 reverted 2026-10-14 (all-NaN trigger on empty-GTT
# loads with multi-chunk tools prompts). Re-enabled only on 27B (user intent).
# Q4 bench arm below for Q5 vs Q4 comparison at equal KV.

[[models]]
model_id = "models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
alias = "qwen3.6-35b-q5"
lazy = true
device = "cuda:0"
expert_device = "cpu"
fit_ctx = true
max_seqs = 2
k_cache_type = "Q8_0"
v_cache_type = "Q8_0"

[models.format]
quantized_file = "Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf"

[[models]]
model_id = "models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
alias = "qwen3.6-35b-q4"
lazy = true
device = "cuda:0"
expert_device = "cpu"
fit_ctx = true
max_seqs = 2
k_cache_type = "Q8_0"
v_cache_type = "Q8_0"

[models.format]
quantized_file = "Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"

# ============================================================
# Qwen3.8 27B dense (lazy, demand-loaded)
# ============================================================
# Dense 27B. Context: 262K. MTP n=3 (model card recommendation).
# KV: K=Q8_0 V=Q4_0 (user intent; model card recommends Q4_0/Q4_0).

[[models]]
model_id = "models/orcarouter/Qwen3.8-27B-Uncensored-GGUF"
alias = "qwen3.8-27b"
lazy = true
k_cache_type = "Q8_0"
v_cache_type = "Q4_0"
mtp_n_predict = 3

[models.format]
quantized_file = "Qwen3.8-27B-Uncensored-Q6_K.gguf"
mmproj = "mmproj-Qwen3.8-27B-Uncensored-f16.gguf"

# Q4 bench arm: same Q6_K file, no ISQ (loads natively).
[[models]]
model_id = "models/orcarouter/Qwen3.8-27B-Uncensored-GGUF"
alias = "qwen3.8-27b-q4"
lazy = true
k_cache_type = "Q8_0"
v_cache_type = "Q4_0"
mtp_n_predict = 3

[models.format]
quantized_file = "Qwen3.8-27B-Uncensored-Q6_K.gguf"
mmproj = "mmproj-Qwen3.8-27B-Uncensored-f16.gguf"

# ============================================================
# Qwen3.8 Flash-Next MoE (lazy, demand-loaded)
# ============================================================
# New arch (qwen4exp), port pending. 512 experts, 10+1 active.
# Context: 262K. MTP self-speculation. n=2 (sweep pending).

[[models]]
model_id = "models/orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF"
alias = "qwen3.8-flash-next"
lazy = true
k_cache_type = "Q8_0"
v_cache_type = "Q8_0"
mtp_n_predict = 2

[models.format]
quantized_file = "Qwen3.8-Flash-Next-Uncensored-IQ4_XS-MTP-00001-of-00003.gguf"
mmproj = "mmproj-Qwen3.8-Flash-Next-Uncensored-F16.gguf"

# ============================================================
# Everything below is lazy: registered at boot, loaded on first request.
# ============================================================

# ------------------------------------------------------------
# Muse Glimmer 30B (vision). MoE, 128 experts.
# Context: ~256K. Q4_K_XL recommended. No MTP.
# ------------------------------------------------------------
[[models]]
model_id = "models/unsloth/Muse-Glimmer-30B-GGUF"
alias = "Muse-glimmer-30b"
lazy = true
mtp = false

[models.format]
quantized_file = "Muse-Glimmer-30B-UD-Q6_K_XL.gguf"
mmproj = "mmproj-Muse-Glimmer-30B-Q8_0.gguf"

