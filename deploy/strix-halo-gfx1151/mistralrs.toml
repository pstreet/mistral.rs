# mistralrs.toml - mistral.rs config mirroring models.ini
#
# Loaded by: mistralrs from-config -f <this file> (see ~/.config/mistralrs-server-wrapper.sh)
# Model paths below are relative to $LOCALAI_ROOT (the service sets
# WorkingDirectory there and the wrapper cds there; cd there for manual runs).
#
# Differences vs models.ini:
#   - ACTIVE default: Qwen3.8-27B (orcarouter); Qwen3.6-35B is now lazy.
#   - Only the first [[models]] entry loads at boot (it seeds the instance);
#     the rest use `lazy = true` (registered, demand-loaded on first request).
#     Demand-loads LRU-evict idle residents to fit (plus headroom) and evict
#     engines idle past the router TTL; concurrent demand-loads for the same
#     model wait on the in-flight load. See [router] below.
#   - Per-model `alias` gives short API names (llama.cpp-style); the full
#     model_id path also resolves. Clients can still just use model="default".
#   - Per-model `alias` gives short API names (llama.cpp-style); the full
#     model_id path also resolves. With one eager model, clients can still
#     just use model="default".
#   - Sampling knobs from models.ini (top-k, top-p, temp, repeat/presence
#     penalty) are per-request in the OpenAI API, not set here.
#   - spec-type = draft-mtp is a global runtime flag in mistral.rs, not per-model.

command = "serve"
# Single active model -> clients address it as "default".
default_model_id = "models/orcarouter/Qwen3.8-27B-Uncensored-GGUF"

[server]
host = "127.0.0.1"
port = 1235
no_ui = true

[paged_attn]
cache_type = "Q8_0"
# Size the KV pool by the fleet's maximum native context (256k; GGUF
# context_length metadata) instead of 90% of free VRAM/GTT: the old default
# grabbed ~78GB (3.1M-token capacity nobody can use) and starved decode
# graphs + any second resident. ~26.1 KB/token on the 27B -> ~6.9GB for
# full 256k context; models with smaller native maxes allocate less.
context_len = 262144

# Demand-load policy for lazy models (router commits 7ba9f430f-1ea83644c).
# Values below are the code defaults, pinned explicitly.
[router]
auto_evict = true
evict_headroom_mb = 2048
load_wait_timeout_secs = 900
evict_busy_wait_secs = 300
idle_ttl_secs = 1800

[runtime]
# TEMP 2026-10-08 (dual-role exercise): the 27B-cuda MTP attach needs the
# recurrent checkpoint pool at capacity 3 (~1.3GB), not 33 (~14.5GB OOM on
# the 24GB 3090). Global cap until per-model max_seqs lands (backlog).
# Removing this line restores the default 32 - and re-blocks the cuda alias.
max_seqs = 2
# Prefix caching ON (prefix_cache_n = 4, 2026-10-09): the hybrid recurrent
# snapshot path was built and probe-validated (identical 3.8k prompt
# 12s -> 0.3s MTP-on, chat turn-2 0.7s, MTP acceptance intact).
# Cost ~739MB reservation per resident engine. History: pre-2026-10-08
# this line was commented out, so the default (16) silently won and
# reserved ~2.5GB against the KV budget (blocked the 27B on the 3090);
# n=16 default stays off. 3090 note: this is per-engine global, so a
# cuda-alias demand-load also reserves it there.
prefix_cache_n = 4
# Decode test 2026-09-07: MTP n=3 stable (+19%). Q4 wall test done, restored.
# MTP sweep 2026-09-11, essay 1500tok temp0.3 (short ctx goodput T/s):
# n=1 10.58, n=2 11.10 (LOCKED), n=3 10.50, n=5 8.27,
# off+graphs 9.12, off+nographs 8.91 (graphs +2.4%, keep on).
# 47k ctx: n=2 5.29 > n=3 4.75 > off 4.50. greedy == auto (sampling
# not the constraint; draft-head quality is).
# A/B recheck 2026-09-11 (machine, /v1/completions 1500tok temp0.3,
# avg_compl_tok_per_sec; harness /tmp/opencode/mtp_bench.py):
# n=1 10.18/10.29, n=2 10.53/10.58/11.05 (best 11.05), n=3 10.47/10.52,
# n=5 8.11. Confirms narrow 1-2 plateau; n=3 does NOT beat n=2 (within
# noise, never above). Run-to-run var ~+/-0.3 (thermal). Keep n=2.
# 35B MTP sweep 2026-09-18, essay 220tok temp0.3 (decode T/s, 3 runs each):
# n=1 48.3/48.4/47.5, n=2 50.8/49.4/50.7, n=3 47.8/45.5/48.4 -> n=2 wins.
# Draft sampling at n=2: auto 51.2/52.5/51.3 vs greedy 50.6/52.4/51.8 retest
# (plus earlier greedy 50.8/49.4/50.7) — identical within noise, keep greedy.
# MTP n=2 vs off on 35B: ~54 vs ~42 (+29%), in line with 27B +36%.
mtp = true
mtp_n_predict = 2
mtp_draft_sampling = "greedy"
# Larger prefill chunk: long prompts run as fewer, bigger prefill chunks,
# which amortizes per-chunk overhead. With the per-dtype MMQ dispatch
# (Q6K > 256 rows routes to dequantize-to-F16 + hipBLASLt) cold 18k prefill
# measures 419-426 tok/s on the 27B (2026-09-25, gfx1151). Capped at the
# 4096 batch-token budget; lower this if concurrent prefill latency matters
# more than single-prompt throughput.
max_prefill_chunk_tokens = 4096
# Prefill batch token quantum: larger chunks amortize per-chunk overhead for long prompts.

# ============================================================
# Qwen3.6 35B MoE (lazy; the orcarouter 27B is the entry default)
# ============================================================

[[models]]
model_id = "models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
alias = "qwen3.6-35b-q5"
mtp = true
lazy = true

[models.format]
quantized_file = "Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf"

# ============================================================
# Qwen3.8 27B (lazy, demand-loaded)
# ============================================================

[[models]]
model_id = "models/orcarouter/Qwen3.8-27B-Uncensored-GGUF"
alias = "qwen3.8-27b"
lazy = true
# Per-model split KV: K=Q8_0 V=Q4_0 while the global default stays Q8_0.
k_cache_type = "Q8_0"
v_cache_type = "Q4_0"

[models.format]
quantized_file = "Qwen3.8-27B-Uncensored-Q6_K.gguf"
mmproj = "mmproj-Qwen3.8-27B-Uncensored-f16.gguf"

# ------------------------------------------------------------
# 27B on the 3090, sizing probe (2026-10-08): measure VRAM timeline
# across ISQ+load to find the ~8GB transient. Keep until fit-ctx
# validation passes.
# ------------------------------------------------------------

[[models]]
model_id = "models/orcarouter/Qwen3.8-27B-Uncensored-GGUF"
alias = "qwen3.8-27b-cuda"
device = "cuda:0"
lazy = true
context_len = 32768
k_cache_type = "Q8_0"
v_cache_type = "Q4_0"

[models.format]
quantized_file = "Qwen3.8-27B-Uncensored-Q6_K.gguf"
mmproj = "mmproj-Qwen3.8-27B-Uncensored-f16.gguf"

[models.quantization]
isq = "Q4K"

# ============================================================
# Everything below is lazy: registered at boot, loaded on first request.
# NOTE: lazy models inherit the global MTP flag unless pinned `mtp = false`
# (all entries below are pinned: two residents at once must fit VRAM, and
# the MTP draft head adds footprint; the eager default keeps MTP n=2).
# ============================================================

# ------------------------------------------------------------
# Muse Glimmer 30B (vision). Standalone: no tok_model_id; config/tokenizer
# are synthesized from the GGUF. NOTE: qwen3_5 standalone builder is proven;
# a non-qwen3_5 vision arch may need its own builder before this lazy-loads.
# ------------------------------------------------------------

[[models]]
model_id = "models/unsloth/Muse-Glimmer-30B-GGUF"
alias = "Muse-glimmer-30b"
lazy = true
mtp = false

[models.format]
quantized_file = "Muse-Glimmer-30B-UD-Q6_K_XL.gguf"
mmproj = "mmproj-Muse-Glimmer-30B-Q8_0.gguf"

# ------------------------------------------------------------
# Large coder / general
# ------------------------------------------------------------

[[models]]
model_id = "models/unsloth/Qwen3-Coder-Next-GGUF"
alias = "qwen3-coder-next"
lazy = true
mtp = false

[models.format]
quantized_file = "Qwen3-Coder-Next-MXFP4_MOE.gguf"

[[models]]
model_id = "models/unsloth/gemma-4-26B-A4B-it-GGUF"
alias = "gemma-4-26b"
lazy = true
mtp = false

[models.format]
quantized_file = "gemma-4-26B-A4B-it-UD-Q6_K_XL.gguf"
mmproj = "mmproj-F16.gguf"

[[models]]
model_id = "models/mradermacher/Llama-3.2-30B-A3B-II-Dark-Champion-INSTRUCT-Heretic-Abliterated-Uncensored-GGUF"
alias = "llama-3.2-30b"
lazy = true
mtp = false

[models.format]
quantized_file = "Llama3.2-30B-A3B-II-Dark-Champion-INSTRUCT-Heretic-Abliterated-Uncensored.Q6_K.gguf"

# ------------------------------------------------------------
# Small / fast
# ------------------------------------------------------------

[[models]]
model_id = "models/unsloth/Qwen3-16B-A3B-GGUF"
alias = "qwen3-16b"
lazy = true
mtp = false

[models.format]
quantized_file = "Qwen3-16B-A3B-Q4_K_M.gguf"

[[models]]
model_id = "models/unsloth/Qwen3.5-4B-MTP-GGUF"
alias = "qwen3.5-4b"
lazy = true
mtp = false

[models.format]
quantized_file = "Qwen3.5-4B-Q8_0.gguf"

# Three-backend exercise 2026-10-09: same 4B on every device class.
# mtp=false mirrors the hip entry (clean 3-way comparison, no CPU
# attach risk - the verify kernels are GPU-only).
[[models]]
model_id = "models/unsloth/Qwen3.5-4B-MTP-GGUF"
alias = "qwen3.5-4b-cuda"
lazy = true
mtp = false
device = "cuda:0"

[models.format]
quantized_file = "Qwen3.5-4B-Q8_0.gguf"

[[models]]
model_id = "models/unsloth/Qwen3.5-4B-MTP-GGUF"
alias = "qwen3.5-4b-cpu"
lazy = true
mtp = false
device = "cpu"
# CPU cannot use the global Q8_0 block KV (GPU-only kernels). The
# per-model BASE cache_type is what clears the inherited global - it
# resets the k/v sides too (resolve_entry_cache_config). TOML takes
# PascalCase variants, unlike the CLI's lowercase strings.
cache_type = "Auto"

[models.format]
quantized_file = "Qwen3.5-4B-Q8_0.gguf"

# ------------------------------------------------------------
# Embeddings (open-webui RAG via /v1/embeddings, 2026-10-09).
# Qwen3-Embedding-0.6B safetensors (1.2GB, 1024-dim, 32k ctx;
# GGUF embedders unsupported by the embedding pipeline - backlog).
# Validated on the probe lane (load <0.5s, deterministic, batched).
# Pinned hip:0 so demand-loads never land it on the crowded 3090;
# mtp=false stops the global mtp=true inherit. Lazy like the rest
# of the fleet - embedding demand-load untested, fall back to eager
# (drop the lazy line) if the router balks. Live at next restart.
# ------------------------------------------------------------

[[models]]
model_id = "models/Qwen/Qwen3-Embedding-0.6B"
alias = "qwen3-embedding-0.6b"
kind = "embedding"
lazy = true
mtp = false
device = "hip:0"
